<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>China · Sep 2026 · Pablo & Aza</title>
  <style>
    /* ═══════════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --text: #e8e0d0;
      --accent: #c8a96e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ═══════════════════════════════════════════
       CITY THEMES
    ═══════════════════════════════════════════ */
    .theme-avion {
      --city-primary: #1a1a3e; --city-accent: #7eb8f7; --city-text: #c5d8f5;
      --city-glow: rgba(126,184,247,0.3); --city-gradient: linear-gradient(135deg, #050510 0%, #0d1b3e 50%, #1a1a3e 100%);
      --city-border: #3a5a9e; --city-tag-bg: #0d1b3e; --city-section-bg: rgba(14,27,62,0.5);
    }
    .theme-beijing {
      --city-primary: #8b0000; --city-accent: #d4a017; --city-text: #f5e6c8;
      --city-glow: rgba(212,160,23,0.25); --city-gradient: linear-gradient(135deg, #1a0000 0%, #3d0000 50%, #5c0a0a 100%);
      --city-border: #8b4513; --city-tag-bg: #3d0000; --city-section-bg: rgba(61,0,0,0.5);
    }
    .theme-chongqing {
      --city-primary: #2d0a1e; --city-accent: #ff4d00; --city-text: #f0c0a0;
      --city-glow: rgba(255,77,0,0.25); --city-gradient: linear-gradient(135deg, #0f0008 0%, #2d0a1e 50%, #3d1a0a 100%);
      --city-border: #8b2200; --city-tag-bg: #2d0a1e; --city-section-bg: rgba(45,10,30,0.5);
    }
    .theme-zhangjiajie {
      --city-primary: #0a1a0f; --city-accent: #5dba6e; --city-text: #c8f0d0;
      --city-glow: rgba(93,186,110,0.25); --city-gradient: linear-gradient(135deg, #020a04 0%, #0a1a0f 50%, #0f2a18 100%);
      --city-border: #2d6b3a; --city-tag-bg: #0a1a0f; --city-section-bg: rgba(10,26,15,0.5);
    }
    .theme-furong {
      --city-primary: #2a1a0a; --city-accent: #e8945a; --city-text: #f5dcc8;
      --city-glow: rgba(232,148,90,0.25); --city-gradient: linear-gradient(135deg, #120a02 0%, #2a1a0a 50%, #3d2415 100%);
      --city-border: #8b5030; --city-tag-bg: #2a1a0a; --city-section-bg: rgba(42,26,10,0.5);
    }
    .theme-fenghuang {
      --city-primary: #1a1a1a; --city-accent: #c0392b; --city-text: #f0ede8;
      --city-glow: rgba(192,57,43,0.2); --city-gradient: linear-gradient(135deg, #080808 0%, #1a1a1a 50%, #252520 100%);
      --city-border: #5a1a1a; --city-tag-bg: #1a1a1a; --city-section-bg: rgba(26,26,26,0.7);
    }
    .theme-shanghai {
      --city-primary: #050515; --city-accent: #00ffcc; --city-text: #e0f0ff;
      --city-glow: rgba(0,255,204,0.35); --city-gradient: linear-gradient(135deg, #000010 0%, #050525 50%, #0a0030 100%);
      --city-border: #00ffcc; --city-tag-bg: #0a0030; --city-section-bg: rgba(5,5,37,0.7);
    }
    .theme-canton {
      --city-primary: #1a0a2a; --city-accent: #ff6b35; --city-text: #ffe8d0;
      --city-glow: rgba(255,107,53,0.25); --city-gradient: linear-gradient(135deg, #080010 0%, #1a0a2a 50%, #2d1020 100%);
      --city-border: #8b3520; --city-tag-bg: #1a0a2a; --city-section-bg: rgba(26,10,42,0.5);
    }

    /* ═══════════════════════════════════════════
       HEADER
    ═══════════════════════════════════════════ */
    header {
      text-align: center;
      padding: 60px 20px 40px;
      position: relative;
    }
    header::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 400px;
      background: radial-gradient(ellipse, rgba(200,169,110,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .header-kana { font-size: 0.85rem; letter-spacing: 0.4em; color: var(--accent); opacity: 0.7; margin-bottom: 16px; text-transform: uppercase; }
    .header-title { font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: normal; letter-spacing: 0.05em; line-height: 1.1; }
    .header-title span { color: var(--accent); }
    .header-sub { margin-top: 12px; font-size: 1rem; color: rgba(232,224,208,0.5); letter-spacing: 0.2em; }
    .header-line { width: 80px; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); margin: 24px auto 0; }

    /* ═══════════════════════════════════════════
       LEGEND
    ═══════════════════════════════════════════ */
    .legend {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
      padding: 0 20px 40px; max-width: 900px; margin: 0 auto;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; letter-spacing: 0.08em; opacity: 0.6; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* ═══════════════════════════════════════════
       CALENDAR GRID
    ═══════════════════════════════════════════ */
    .calendar {
      max-width: 1200px; margin: 0 auto;
      padding: 0 20px 80px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    /* ═══════════════════════════════════════════
       DAY CARD
    ═══════════════════════════════════════════ */
    .day-card {
      background: var(--city-gradient);
      border: 1px solid var(--city-border);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .day-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px var(--city-glow), 0 0 0 1px var(--city-border);
    }
    .day-card.open { grid-column: 1 / -1; cursor: default; }
    .day-card.open:hover { transform: none; }

    /* Shanghai scanline */
    .theme-shanghai::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0,255,204,0.04), transparent);
      animation: scanline 4s infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes scanline { 0% { left: -100%; } 100% { left: 200%; } }

    /* Beijing pattern */
    .theme-beijing::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(45deg, rgba(212,160,23,0.02) 0px, rgba(212,160,23,0.02) 1px, transparent 1px, transparent 8px);
      pointer-events: none;
      z-index: 0;
    }

    .card-header {
      padding: 18px 20px 14px;
      display: flex; align-items: flex-start; justify-content: space-between;
      position: relative; z-index: 1;
    }
    .card-date-block { display: flex; flex-direction: column; }
    .card-day-num { font-size: 2.8rem; font-weight: bold; line-height: 1; color: var(--city-accent); letter-spacing: -0.02em; }
    .theme-shanghai .card-day-num { font-family: 'Courier New', monospace; text-shadow: 0 0 20px var(--city-accent), 0 0 40px rgba(0,255,204,0.5); }
    .card-weekday { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--city-text); opacity: 0.5; margin-top: 2px; }
    .card-city-badge { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .city-name { font-size: 0.85rem; letter-spacing: 0.12em; color: var(--city-text); opacity: 0.9; text-transform: uppercase; }
    .theme-shanghai .city-name { font-family: 'Courier New', monospace; color: var(--city-accent); text-shadow: 0 0 10px var(--city-accent); letter-spacing: 0.25em; }
    .theme-fenghuang .city-name { font-style: italic; letter-spacing: 0.08em; }
    .city-emoji-badge { font-size: 1.2rem; }
    .card-night-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.3); border: 1px solid var(--city-border); border-radius: 20px; padding: 2px 8px; font-size: 0.65rem; letter-spacing: 0.1em; color: var(--city-text); opacity: 0.7; margin-top: 4px; }
    .card-divider { height: 1px; margin: 0 20px; background: linear-gradient(90deg, var(--city-border), transparent); opacity: 0.4; position: relative; z-index: 1; }
    .card-preview { padding: 12px 20px 18px; position: relative; z-index: 1; }
    .preview-item { font-size: 0.82rem; color: var(--city-text); opacity: 0.7; line-height: 1.5; display: flex; align-items: flex-start; gap: 6px; }
    .preview-item + .preview-item { margin-top: 4px; }
    .preview-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--city-accent); flex-shrink: 0; margin-top: 7px; }
    .card-expand-hint { text-align: center; padding: 8px; font-size: 0.65rem; letter-spacing: 0.15em; color: var(--city-accent); opacity: 0.4; text-transform: uppercase; position: relative; z-index: 1; }

    /* ═══════════════════════════════════════════
       EXPANDED PANEL
    ═══════════════════════════════════════════ */
    .day-expanded {
      display: none;
      animation: expandIn 0.3s ease;
      position: relative; z-index: 1;
    }
    @keyframes expandIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .day-card.open .day-expanded { display: block; }

    /* ── Hero Photo ── */
    .expanded-photo {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
      border-top: 1px solid var(--city-border);
      filter: saturate(0.85) brightness(0.9);
    }
    .photo-wrapper {
      position: relative;
      overflow: hidden;
    }
    .photo-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 40px 28px 14px;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
    }
    /* Shanghai: neon photo overlay */
    .theme-shanghai .photo-wrapper::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom right, rgba(0,255,204,0.07), rgba(255,0,204,0.05));
      pointer-events: none;
    }
    /* Fenghuang: ink wash overlay */
    .theme-fenghuang .photo-wrapper::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.4));
      pointer-events: none;
    }

    /* ── Body ── */
    .expanded-body { padding: 28px 28px 0; }

    .expanded-title {
      font-size: 1.5rem;
      color: var(--city-accent);
      margin-bottom: 14px;
      letter-spacing: 0.05em;
      line-height: 1.2;
    }
    .theme-shanghai .expanded-title {
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 20px var(--city-accent);
      font-size: 1.3rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      position: relative;
    }
    .theme-shanghai .expanded-title::before {
      content: attr(data-text);
      position: absolute;
      left: 2px; top: 0;
      color: #ff00cc;
      text-shadow: 0 0 8px #ff00cc;
      clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%);
      animation: glitch 5s infinite;
      opacity: 0.6;
    }
    @keyframes glitch { 0%,90%,100% { transform:translate(0); } 92% { transform:translate(-3px,0); } 94% { transform:translate(3px,0); } 96% { transform:translate(-1px,0); } }

    .expanded-description { font-size: 0.95rem; line-height: 1.8; color: var(--city-text); opacity: 0.85; max-width: 900px; }
    .theme-fenghuang .expanded-description { font-style: italic; line-height: 2; opacity: 0.9; }

    /* ── Transport ── */
    .expanded-transport { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .transport-tag {
      background: var(--city-tag-bg);
      border: 1px solid var(--city-border);
      border-radius: 3px;
      padding: 5px 12px;
      font-size: 0.75rem;
      color: var(--city-text);
      opacity: 0.8;
      letter-spacing: 0.06em;
    }
    .theme-shanghai .transport-tag { font-family: 'Courier New', monospace; border-color: var(--city-accent); color: var(--city-accent); text-shadow: 0 0 5px var(--city-accent); }

    /* ── Two-column grid for hotel + weather ── */
    .expanded-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 24px;
    }
    @media (max-width: 700px) { .expanded-grid { grid-template-columns: 1fr; } }

    /* ── Hotel Card ── */
    .hotel-card {
      background: var(--city-section-bg);
      border: 1px solid var(--city-border);
      border-radius: 4px;
      padding: 18px;
    }
    .section-label {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--city-accent);
      opacity: 0.7;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--city-border); opacity: 0.4; }
    .hotel-name { font-size: 1rem; color: var(--city-text); margin-bottom: 4px; letter-spacing: 0.04em; }
    .theme-shanghai .hotel-name { font-family: 'Courier New', monospace; color: var(--city-accent); }
    .hotel-stars { color: var(--city-accent); font-size: 0.7rem; opacity: 0.8; margin-bottom: 12px; }
    .hotel-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .hotel-key { font-size: 0.7rem; letter-spacing: 0.1em; color: var(--city-text); opacity: 0.5; text-transform: uppercase; }
    .hotel-val { font-size: 0.82rem; color: var(--city-text); opacity: 0.85; }
    .hotel-confirmation { margin-top: 12px; padding: 8px 10px; background: rgba(0,0,0,0.3); border-radius: 3px; font-size: 0.72rem; color: var(--city-text); opacity: 0.5; letter-spacing: 0.08em; font-family: monospace; }
    .mock-badge { font-size: 0.55rem; letter-spacing: 0.12em; background: rgba(255,200,0,0.15); color: rgba(255,200,0,0.7); border: 1px solid rgba(255,200,0,0.2); border-radius: 10px; padding: 1px 6px; vertical-align: middle; margin-left: 6px; }

    /* ── Weather Widget ── */
    .weather-card {
      background: var(--city-section-bg);
      border: 1px solid var(--city-border);
      border-radius: 4px;
      padding: 18px;
    }
    .weather-main { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
    .weather-icon { font-size: 2.8rem; line-height: 1; }
    .weather-temp { font-size: 2.2rem; color: var(--city-accent); line-height: 1; }
    .theme-shanghai .weather-temp { font-family: 'Courier New', monospace; text-shadow: 0 0 10px var(--city-accent); }
    .weather-condition { font-size: 0.8rem; color: var(--city-text); opacity: 0.7; margin-top: 4px; letter-spacing: 0.06em; }
    .weather-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .weather-detail-item { background: rgba(0,0,0,0.2); border-radius: 3px; padding: 8px 10px; }
    .weather-detail-key { font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--city-text); opacity: 0.4; margin-bottom: 3px; }
    .weather-detail-val { font-size: 0.82rem; color: var(--city-text); opacity: 0.8; }
    .weather-note { margin-top: 10px; font-size: 0.65rem; color: var(--city-text); opacity: 0.35; letter-spacing: 0.06em; font-style: italic; }

    /* ── Curiosities ── */
    .curiosities-section { margin-top: 24px; }
    .curiosities-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 14px; }
    .curiosity-item {
      background: var(--city-section-bg);
      border: 1px solid var(--city-border);
      border-radius: 4px;
      padding: 14px 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      transition: box-shadow 0.2s;
    }
    .curiosity-item:hover { box-shadow: 0 0 0 1px var(--city-border), 0 4px 20px var(--city-glow); }
    .curiosity-num {
      font-size: 1.6rem;
      color: var(--city-accent);
      opacity: 0.25;
      font-weight: bold;
      line-height: 1;
      flex-shrink: 0;
      font-family: Georgia, serif;
    }
    .theme-shanghai .curiosity-num { font-family: 'Courier New', monospace; }
    .curiosity-body {}
    .curiosity-title { font-size: 0.8rem; font-weight: bold; color: var(--city-accent); margin-bottom: 4px; letter-spacing: 0.04em; }
    .theme-shanghai .curiosity-title { font-family: 'Courier New', monospace; }
    .curiosity-text { font-size: 0.8rem; color: var(--city-text); opacity: 0.7; line-height: 1.55; }
    .theme-fenghuang .curiosity-text { font-style: italic; }

    /* ── Notes ── */
    .expanded-notes {
      margin-top: 24px;
      padding: 16px 18px;
      background: rgba(0,0,0,0.25);
      border-left: 2px solid var(--city-accent);
      border-radius: 0 4px 4px 0;
    }
    .expanded-notes-title { font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--city-accent); opacity: 0.7; margin-bottom: 8px; }
    .expanded-notes-body { font-size: 0.85rem; color: var(--city-text); opacity: 0.65; line-height: 1.6; }

    .close-hint {
      text-align: center;
      padding: 20px;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--city-accent);
      opacity: 0.35;
      cursor: pointer;
      text-transform: uppercase;
    }
    .close-hint:hover { opacity: 0.7; }

    /* ═══════════════════════════════════════════
       FOOTER
    ═══════════════════════════════════════════ */
    footer { text-align: center; padding: 40px 20px; font-size: 0.75rem; letter-spacing: 0.15em; color: rgba(232,224,208,0.2); border-top: 1px solid rgba(200,169,110,0.1); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(200,169,110,0.3); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="header-kana">中国 · Septiembre 2026</div>
  <h1 class="header-title">China<span> ·</span> Pablo &amp; Aza</h1>
  <p class="header-sub">5 sep — 20 sep · 16 días</p>
  <div class="header-line"></div>
</header>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#7eb8f7"></div> Vuelo</div>
  <div class="legend-item"><div class="legend-dot" style="background:#d4a017"></div> Pekín</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ff4d00"></div> Chongqing</div>
  <div class="legend-item"><div class="legend-dot" style="background:#5dba6e"></div> Zhangjiajie</div>
  <div class="legend-item"><div class="legend-dot" style="background:#e8945a"></div> Furong</div>
  <div class="legend-item"><div class="legend-dot" style="background:#c0392b"></div> Fenghuang</div>
  <div class="legend-item"><div class="legend-dot" style="background:#00ffcc"></div> Shanghái</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ff6b35"></div> Cantón</div>
</div>

<div class="calendar" id="calendar"></div>

<footer>Pablo &amp; Aza · China 2026 · Hecho con ❤️ e IA</footer>

<script>
/* ═══════════════════════════════════════════
   DATA
   - photo: Unsplash query URL. Replace with real URLs when you have them.

     To connect to live data: fetch from https://api.openweathermap.org/data/2.5/weather?q={city}&appid={KEY}&units=metric
═══════════════════════════════════════════ */
const days = [
  {
    date: 5, month: "sep", weekday: "Sábado",
    city: "Vuelo", theme: "avion", emoji: "✈️", night: "Avión",
    preview: ["Madrid → Ámsterdam → Pekín", "Salida 15:55 · Llegada +1 a las 13:25"],
    photo: { url: "https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=1200&q=80", caption: "Sobre las nubes · Ruta MAD–AMS–PEK" },

    transport: ["MAD → AMS · 15:55–18:35", "AMS → PEK · 21:40–13:25+1"],
    hotel: null,
    weather: null,
    curiosities: [
      { title: "La ruta sobrevuela Mongolia", text: "Madrid–Pekín cubre ~9.200 km sobrevolando Francia, Rusia, Siberia y el desierto de Gobi." },
      { title: "Schiphol como hub", text: "Amsterdam Schiphol es el 4.º aeropuerto más transitado de Europa y hub de KLM desde 1920." },
      { title: "Diferencia horaria", text: "Pekín está a +6h de Madrid en verano. Habrá que armarse de paciencia el primer día." },

/* ═══════════════════════════════════════════
   RENDER
═══════════════════════════════════════════ */
function buildCard(day) {
  const card = document.createElement('div');
  card.className = `day-card theme-${day.theme}`;

  const previewItems = day.preview.map(p =>
    `<div class="preview-item"><div class="preview-dot"></div><span>${p}</span></div>`
  ).join('');

  // Transport
  const transportHTML = day.transport.length
    ? `<div class="expanded-transport">${day.transport.map(t => `<span class="transport-tag">⬡ ${t}</span>`).join('')}</div>`
    : '';

  // Hotel
  const hotelHTML = day.hotel ? `
    <div class="hotel-card">
      <div class="section-label">🏨 Hotel <span class="mock-badge">MOCK</span></div>
      <div class="hotel-name">${day.hotel.name}</div>
      <div class="hotel-stars">${day.hotel.stars}</div>
      <div class="hotel-row"><span class="hotel-key">Check-in</span><span class="hotel-val">${day.hotel.checkin}</span></div>
      <div class="hotel-row"><span class="hotel-key">Check-out</span><span class="hotel-val">${day.hotel.checkout}</span></div>
      <div class="hotel-row"><span class="hotel-key">Habitación</span><span class="hotel-val">${day.hotel.room}</span></div>
      <div class="hotel-confirmation">REF: ${day.hotel.ref}</div>
    </div>` : '';

  // Weather
  const weatherHTML = day.weather ? `
    <div class="weather-card">
      <div class="section-label">🌤 Tiempo en Septiembre <span class="mock-badge">MOCK</span></div>
      <div class="weather-main">
        <div class="weather-icon">${day.weather.icon}</div>
        <div>
          <div class="weather-temp">${day.weather.temp}</div>
          <div class="weather-condition">${day.weather.condition}</div>
        </div>
      </div>
      <div class="weather-details">
        <div class="weather-detail-item"><div class="weather-detail-key">Humedad</div><div class="weather-detail-val">${day.weather.humidity}</div></div>
        <div class="weather-detail-item"><div class="weather-detail-key">Viento</div><div class="weather-detail-val">${day.weather.wind}</div></div>
        <div class="weather-detail-item"><div class="weather-detail-key">Lluvia</div><div class="weather-detail-val">${day.weather.rain}</div></div>
        <div class="weather-detail-item"><div class="weather-detail-key">Sensación</div><div class="weather-detail-val">${day.weather.feels}</div></div>
      </div>
      <div class="weather-note">Datos históricos de septiembre. Conexión a API en desarrollo.</div>
    </div>` : '';

  // Grid (hotel + weather)
  const gridHTML = (hotelHTML || weatherHTML)
    ? `<div class="expanded-grid">${hotelHTML}${weatherHTML}</div>` : '';

  // Curiosities
  const curiositiesHTML = day.curiosities.map((c, i) => `
    <div class="curiosity-item">
      <div class="curiosity-num">${i + 1}</div>
      <div class="curiosity-body">
        <div class="curiosity-title">${c.title}</div>
        <div class="curiosity-text">${c.text}</div>
      </div>
    </div>`).join('');

  // Notes
  const notesHTML = day.notes ? `
    <div class="expanded-notes">
      <div class="expanded-notes-title">Notas</div>
      <div class="expanded-notes-body">${day.notes}</div>
    </div>` : '';

  card.innerHTML = `
    <div class="card-header">
      <div class="card-date-block">
        <div class="card-day-num">${day.date}</div>
        <div class="card-weekday">${day.weekday} ${day.month}</div>
      </div>
      <div class="card-city-badge">
        <span class="city-emoji-badge">${day.emoji}</span>
        <span class="city-name">${day.city}</span>
        <span class="card-night-badge">🌙 ${day.night}</span>
      </div>
    </div>
    <div class="card-divider"></div>
    <div class="card-preview">${previewItems}</div>
    <div class="card-expand-hint">· click para expandir ·</div>

    <div class="day-expanded">
      <div class="photo-wrapper">
        <img class="expanded-photo" src="${day.photo.url}" alt="${day.city}" loading="lazy" onerror="this.style.display='none'">
        <div class="photo-caption">${day.photo.caption}</div>
      </div>
      <div class="expanded-body">
        <div class="expanded-title" data-text="${day.title}">${day.title}</div>
        <div class="expanded-description">${day.description}</div>
        ${transportHTML}
        ${gridHTML}
        <div class="curiosities-section">
          <div class="section-label">📜 Curiosidades históricas</div>
          <div class="curiosities-grid">${curiositiesHTML}</div>
        </div>
        ${notesHTML}
        <div class="close-hint" onclick="closeCard(this)">▲ cerrar</div>
      </div>
    </div>
  `;

  card.querySelector('.card-header').addEventListener('click', () => toggleCard(card));
  card.querySelector('.card-preview').addEventListener('click', () => toggleCard(card));
  card.querySelector('.card-expand-hint').addEventListener('click', () => toggleCard(card));

  return card;
}

function toggleCard(card) {
  const isOpen = card.classList.contains('open');
  document.querySelectorAll('.day-card.open').forEach(c => c.classList.remove('open'));
  if (!isOpen) {
    card.classList.add('open');
    setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
  }
}

function closeCard(btn) {
  btn.closest('.day-card').classList.remove('open');
}

const calendar = document.getElementById('calendar');
days.forEach(day => calendar.appendChild(buildCard(day)));
</script>
